name: Release

# A pushed tag vX.Y.Z (or vX.Y.Z-maitri.N for a maitri-only fix on the same
# upstream release) publishes a source tarball and its checksum.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the tag to match the tree's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)(-maitri\.[0-9]+)?$ ]] || { echo "::error::tag $TAG is not vX.Y[.Z] or vX.Y[.Z]-maitri.N"; exit 1; }
          version=${BASH_REMATCH[1]}
          manifest=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [[ $manifest != "$version" ]]; then
            echo "::error::tag $TAG and manifest $manifest must agree"
            exit 1
          fi
          tools/rebrand.sh --check

      - name: Test
        run: make test

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="maitri-cellular-${TAG#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$TAG"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "maitri-cellular $TAG" \
            --notes "Source for maitri-cellular $TAG, the maitri build of [relctx/omarchy-cellular](https://github.com/relctx/omarchy-cellular) by relctx. Install with maitri plugin add https://github.com/maitrios/maitri-cellular.git." \
            "dist/$name.tar.gz" dist/SHA256SUMS
